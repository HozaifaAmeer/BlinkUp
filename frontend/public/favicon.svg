<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="circleUpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  
  <!-- Rounded squircle background matching CircleUp theme -->
  <rect width="100" height="100" rx="24" fill="url(#circleUpGrad)" />

  <!-- Connecting network lines -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 50 24 L 72.5 37 L 72.5 63 L 50 76 L 27.5 63 L 27.5 37 Z" stroke-width="4" stroke-opacity="0.9"/>
    <line x1="50" y1="24" x2="50" y2="50" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="72.5" y1="37" x2="50" y2="50" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="72.5" y1="63" x2="50" y2="50" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="50" y1="76" x2="50" y2="50" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="27.5" y1="63" x2="50" y2="50" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="27.5" y1="37" x2="50" y2="50" stroke-width="3" stroke-opacity="0.6"/>
  </g>

  <!-- Outer nodes -->
  <circle cx="50" cy="24" r="6" fill="#ffffff" />
  <circle cx="72.5" cy="37" r="6" fill="#ffffff" />
  <circle cx="72.5" cy="63" r="6" fill="#ffffff" />
  <circle cx="50" cy="76" r="6" fill="#ffffff" />
  <circle cx="27.5" cy="63" r="6" fill="#ffffff" />
  <circle cx="27.5" cy="37" r="6" fill="#ffffff" />

  <!-- Center node -->
  <circle cx="50" cy="50" r="7.5" fill="#ffffff" />
  <circle cx="50" cy="50" r="3.5" fill="#6366f1" />
</svg>